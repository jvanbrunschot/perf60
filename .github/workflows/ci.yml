name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A new push to a PR cancels its run in progress. Tag runs (via workflow_call) get their own group.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Supply-chain rules (see openspec/specs/ci-release): third-party actions pinned by full SHA,
# no persisted git credentials, cargo --locked, npm only from a lockfile with scripts disabled.

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  specs:
    name: openspec validate
    runs-on: ubuntu-latest
    # The only job that installs npm packages: no token scopes, no credentials, no cache.
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pinned OpenSpec CLI (lockfile only, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tools/openspec
      - name: Validate specs
        env:
          OPENSPEC_TELEMETRY: "0"
        run: tools/openspec/node_modules/.bin/openspec validate --all --strict

  verify:
    name: verify ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned eBPF nightly from build.rs
        run: |
          echo "EBPF_TOOLCHAIN=$(sed -n 's/^const EBPF_TOOLCHAIN: &str = "\(.*\)";/\1/p' build.rs)" >> "$GITHUB_ENV"
      # Installed first: dtolnay/rust-toolchain makes the last installed toolchain the default.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.EBPF_TOOLCHAIN }}
          components: rust-src
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}-deep
      - name: Install pinned bpf-linker (checksum-verified release binary)
        run: |
          scripts/install-bpf-linker.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Clippy with the eBPF probes
        run: cargo clippy --locked --features deep --target ${{ matrix.target }} -- -D warnings
      - name: Run in minimal containers (alpine, debian-slim, busybox), plus privileged --deep
        run: scripts/verify.sh --deep ${{ matrix.target }}
