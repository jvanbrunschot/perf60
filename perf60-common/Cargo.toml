[package]
name = "perf60-common"
version = "0.1.0"
edition = "2024"
description = "Map key/value types shared between perf60 and its eBPF programs"
license = "MIT"

[features]
# User space: implement aya::Pod so the types can be read from maps.
user = ["dep:aya"]

[dependencies]
aya = { version = "0.14.0", default-features = false, optional = true }

[lib]
path = "src/lib.rs"
