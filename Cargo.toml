[package]
name = "perf60"
version = "0.1.0"
edition = "2024"
description = "Linux performance triage in 60 seconds: Brendan Gregg's checklist in one static binary"
license = "MIT"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
