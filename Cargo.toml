[package]
name = "perf60"
version = "0.1.0"
edition = "2024"
description = "Linux performance triage in 60 seconds: Brendan Gregg's checklist in one static binary"
license = "MIT"

[features]
# eBPF probes for `--deep` (runqlat, biolatency, execsnoop, tcpretrans). Building needs a pinned
# nightly with rust-src and bpf-linker: see scripts/build-deep.sh. Off by default so plain
# `cargo build`/`cargo test` work on any host.
deep = ["dep:aya", "dep:perf60-common", "dep:aya-build"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aya = { version = "0.14.0", default-features = false, optional = true }
perf60-common = { path = "perf60-common", features = ["user"], optional = true }

[build-dependencies]
aya-build = { version = "0.2.0", default-features = false, optional = true }

[workspace]
resolver = "3"
members = [".", "perf60-common", "perf60-ebpf"]
# perf60-ebpf only builds for bpfel-unknown-none (via aya-build in build.rs).
default-members = [".", "perf60-common"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# bpf-linker rejects -Os/-Oz; BTF needs debug info and no stripping.
[profile.release.package.perf60-ebpf]
opt-level = 3
debug = 2
codegen-units = 1
strip = false
